[project]
name = "unit-test-generator-agent"
version = "0.1.0"
description = "LangGraph agent that generates unit tests from a PR diff"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.40",
    "langsmith[openai-agents]>=0.1.140",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.1",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "unidiff>=0.7.5",
]

[project.scripts]
testgen = "agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
